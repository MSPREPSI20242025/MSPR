version: "3.8"

services:
    # PostgreSQL Database
    postgres:
        build:
            context: ../..
            dockerfile: infrastructure/docker/Dockerfile.postgres
        container_name: mspr-postgres
        env_file:
            - ../../.env
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - postgres_logs:/var/log/postgresql
        ports:
            - "${POSTGRES_PORT:-5455}:5432"
        networks:
            - mspr-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-mspr} -d ${POSTGRES_DB:-mspr}",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    # Backend API
    backend:
        build:
            context: ../..
            dockerfile: infrastructure/docker/Dockerfile.backend
        container_name: mspr-backend
        env_file:
            - ../../.env
        ports:
            - "${BACKEND_PORT:-3001}:3001"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - mspr-network
        restart: unless-stopped
        # healthcheck:
        #     test: ["CMD-SHELL", "curl -f http://localhost:3001/ || exit 1"]
        #     interval: 30s
        #     timeout: 10s
        #     retries: 5
        #     start_period: 30s
        volumes:
            - backend_logs:/app/logs

    # Frontend Application
    frontend:
        build:
            context: ../..
            dockerfile: infrastructure/docker/Dockerfile.frontend
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
                CLUSTER_NAME: ${CLUSTER_NAME:-us}
                CLUSTER_FEATURES: ${CLUSTER_FEATURES:-api_technical,dataviz,etl}
                API_TOKEN: ${API_TOKEN:-}
                CLUSTER_LANGUAGES: ${CLUSTER_LANGUAGES:-en}
        container_name: mspr-frontend
        env_file:
            - ../../.env
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        depends_on:
            - backend
              # backend:
              #     condition: service_healthy
        networks:
            - mspr-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -f http://localhost:3000/api/health || exit 1",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        volumes:
            - frontend_logs:/app/logs

networks:
    mspr-network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    postgres_logs:
        driver: local
    backend_logs:
        driver: local
    frontend_logs:
        driver: local
