apiVersion: v1
kind: ConfigMap
metadata:
  name: mspr-config-us
  namespace: mspr-us
  labels:
    app: mspr
    cluster: us
data:
  NODE_ENV: "production"
  CLUSTER_NAME: "us"
  CLUSTER_FEATURES: "api_technical,dataviz,etl"
  CLUSTER_LANGUAGES: "en"
  HIGH_VOLUME_MODE: "true"
  PERFORMANCE_OPTIMIZATION: "true"
  ENABLE_API_TECHNICAL: "true"
  ENABLE_MONITORING: "true"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  FRONTEND_PORT: "3000"
  BACKEND_PORT: "3001"
  REDIS_PORT: "6379"
  BACKUP_RETENTION_DAYS: "30"
  ETL_SCHEDULE: "0 2 * * *"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config-us
  namespace: mspr-us
  labels:
    app: postgres
    cluster: us
data:
  POSTGRES_DB: "mspr_us"
  POSTGRES_USER: "mspr_us_user"