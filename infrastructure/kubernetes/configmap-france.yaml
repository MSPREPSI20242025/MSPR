apiVersion: v1
kind: ConfigMap
metadata:
  name: mspr-config-france
  namespace: mspr-france
  labels:
    app: mspr
    cluster: france
    description: "Configuration pour le cluster France avec conformité RGPD"
data:
  # Configuration de base
  NODE_ENV: "production"
  CLUSTER_NAME: "france"
  CLUSTER_FEATURES: "dataviz,etl"
  CLUSTER_LANGUAGES: "fr"
  DEFAULT_LANGUAGE: "fr"
  
  # Configuration RGPD
  GDPR_COMPLIANCE: "true"
  DATA_RETENTION_DAYS: "90"
  ENABLE_CONSENT_MANAGEMENT: "true"
  ENABLE_DATA_PORTABILITY: "true"
  ENABLE_RIGHT_TO_DELETION: "true"
  ANONYMIZE_IP: "true"
  COOKIE_CONSENT_REQUIRED: "true"
  ENCRYPT_PERSONAL_DATA: "true"
  AUDIT_DATA_ACCESS: "true"
  DATA_MINIMIZATION: "true"
  PURPOSE_LIMITATION: "true"
  
  # Fonctionnalités désactivées pour la sécurité
  ENABLE_API_TECHNICAL: "false"
  
  # Configuration de monitoring
  ENABLE_MONITORING: "true"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  ANONYMIZE_LOGS: "true"
  LOG_RETENTION_DAYS: "30"
  
  # Ports des services
  FRONTEND_PORT: "3000"
  BACKEND_PORT: "3001"
  REDIS_PORT: "6379"
  
  # Configuration des sauvegardes
  BACKUP_RETENTION_DAYS: "30"
  ENCRYPT_BACKUPS: "true"
  ETL_SCHEDULE: "0 2 * * *"
  
  # Localisation française
  TIMEZONE: "Europe/Paris"
  CURRENCY: "EUR"
  DATE_FORMAT: "DD/MM/YYYY"
  NUMBER_FORMAT: "fr-FR"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config-france
  namespace: mspr-france
  labels:
    app: postgres
    cluster: france
    description: "Configuration PostgreSQL pour le cluster France"
data:
  POSTGRES_DB: "mspr_france"
  POSTGRES_USER: "mspr_france_user"