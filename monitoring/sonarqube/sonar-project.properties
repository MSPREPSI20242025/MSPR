# SonarQube project configuration for MSPR
sonar.projectKey=mspr
sonar.projectName=MSPR - Surveillance des Pandémies
sonar.projectVersion=1.0
sonar.organization=mspr-org

# Source code configuration
sonar.sources=rest/src,site/src,main.py,fetch.py,postgress.py
sonar.tests=tests,rest/tests,site/__tests__
sonar.sourceEncoding=UTF-8

# Language-specific configurations
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.python.file.suffixes=.py

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.min.js,**/coverage/**,**/__pycache__/**,**/migrations/**
sonar.test.exclusions=**/node_modules/**,**/build/**,**/dist/**

# Code coverage configuration
sonar.javascript.lcov.reportPaths=rest/coverage/lcov.info,site/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts,**/*.test.jsx,**/*.test.tsx

# Test execution reports
sonar.testExecutionReportPaths=rest/test-results.xml,site/test-results.xml

# Duplication detection
sonar.cpd.exclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts

# Quality gate configuration
sonar.qualitygate.wait=true

# Security configuration
sonar.security.enabled=true
sonar.security.hotspots.enabled=true

# GDPR compliance rules (custom)
sonar.gdpr.enabled=true
sonar.gdpr.patterns=email,phone,address,personal,private,confidential

# Analysis parameters
sonar.analysis.mode=publish
sonar.branch.name=${BRANCH_NAME}
sonar.pullrequest.key=${PR_NUMBER}
sonar.pullrequest.branch=${PR_BRANCH}
sonar.pullrequest.base=${PR_BASE}

# Additional properties for multi-cluster setup
sonar.projectDescription=Pandemic surveillance platform with multi-cluster deployment (US, France, Switzerland)
sonar.links.homepage=https://mspr.example.com
sonar.links.ci=https://github.com/mspr/mspr/actions
sonar.links.scm=https://github.com/mspr/mspr
sonar.links.issue=https://github.com/mspr/mspr/issues

# Custom rules for cluster-specific code
sonar.rule.cluster.us=javascript:S3776  # Cognitive complexity for US high-performance code
sonar.rule.cluster.france=javascript:S6245  # GDPR compliance rules
sonar.rule.cluster.switzerland=javascript:S1854  # Minimal code complexity