# Prometheus configuration for MSPR monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mspr-monitor'
    cluster: '${CLUSTER_NAME:-development}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rules for alerting
rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Backend API metrics
  - job_name: 'mspr-backend'
    static_configs:
      - targets: ['backend:3001']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend'
      - source_labels: []
        target_label: service
        replacement: 'backend'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

  # Frontend metrics
  - job_name: 'mspr-frontend'
    static_configs:
      - targets: ['frontend:3000']
    scrape_interval: 30s
    metrics_path: /api/metrics
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'frontend'
      - source_labels: []
        target_label: service
        replacement: 'frontend'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'
      - source_labels: []
        target_label: service
        replacement: 'database'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

  # Redis metrics (for US and France clusters)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'
      - source_labels: []
        target_label: service
        replacement: 'cache'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'host'
      - source_labels: []
        target_label: service
        replacement: 'system'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'containers'
      - source_labels: []
        target_label: service
        replacement: 'containers'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'nginx'
      - source_labels: []
        target_label: service
        replacement: 'loadbalancer'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

  # Blackbox exporter for external monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://frontend:3000/health
        - http://backend:3001/health
        - https://us.mspr.example.com/health
        - https://france.mspr.example.com/health
        - https://switzerland.mspr.example.com/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: []
        target_label: service
        replacement: 'healthcheck'
      - source_labels: []
        target_label: cluster
        replacement: '${CLUSTER_NAME:-development}'

# Storage configuration
storage:
  tsdb:
    path: /prometheus/data
    retention.time: 30d
    retention.size: 10GB
    wal-compression: true

# Web configuration
web:
  console.templates: /etc/prometheus/consoles
  console.libraries: /etc/prometheus/console_libraries
  external-url: http://localhost:9090/
  enable-lifecycle: true
  enable-admin-api: true