name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster to deploy to'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - france
          - switzerland

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: mspr

jobs:
  # Build and push Docker images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    strategy:
      matrix:
        service: [frontend, backend, postgres, etl]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=staging

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging environments
  deploy-us:
    name: Deploy to US Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.cluster == 'us' || github.event.inputs.cluster == '' || github.ref == 'refs/heads/develop'
    environment:
      name: staging-us
      url: https://us-staging.mspr.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          # Create staging environment configuration
          cat > .env.staging << EOF
          NODE_ENV=staging
          CLUSTER_NAME=us
          CLUSTER_FEATURES=api_technical,dataviz,etl
          CLUSTER_LANGUAGES=en
          
          # Database
          POSTGRES_DB=mspr_staging
          POSTGRES_USER=mspr_staging_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_STAGING }}
          
          # API
          API_TOKEN=${{ secrets.API_TOKEN_STAGING }}
          JWT_SECRET=${{ secrets.JWT_SECRET_STAGING }}
          
          # Services
          FRONTEND_PORT=3000
          BACKEND_PORT=3001
          NEXT_PUBLIC_API_URL=https://us-staging-api.mspr.example.com
          
          # Performance optimization for US cluster
          HIGH_VOLUME_MODE=true
          PERFORMANCE_OPTIMIZATION=true
          EOF

      - name: Deploy to staging
        run: |
          # Copy environment file
          cp .env.staging .env.us
          
          # Run deployment script
          chmod +x infrastructure/scripts/deploy.sh
          ./infrastructure/scripts/deploy.sh --cluster us --environment staging

      - name: Run smoke tests
        run: |
          # Wait for deployment to complete
          sleep 60
          
          # Test API endpoints
          curl -f ${{ secrets.STAGING_US_API_URL }}/health
          
          # Test frontend
          curl -f ${{ secrets.STAGING_US_FRONTEND_URL }}/

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'US Staging deployment: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-france:
    name: Deploy to France Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.cluster == 'france'
    environment:
      name: staging-france
      url: https://france-staging.mspr.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          # Create staging environment configuration
          cat > .env.staging << EOF
          NODE_ENV=staging
          CLUSTER_NAME=france
          CLUSTER_FEATURES=dataviz,etl
          CLUSTER_LANGUAGES=fr
          
          # Database
          POSTGRES_DB=mspr_staging_france
          POSTGRES_USER=mspr_staging_france_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_STAGING_FRANCE }}
          
          # API
          API_TOKEN=${{ secrets.API_TOKEN_STAGING_FRANCE }}
          JWT_SECRET=${{ secrets.JWT_SECRET_STAGING_FRANCE }}
          
          # Services
          FRONTEND_PORT=3000
          BACKEND_PORT=3001
          NEXT_PUBLIC_API_URL=https://france-staging-api.mspr.example.com
          
          # GDPR compliance
          GDPR_COMPLIANCE=true
          DATA_RETENTION_DAYS=90
          GDPR_CONTACT_EMAIL=privacy@mspr.example.com
          EOF

      - name: Deploy to staging
        run: |
          # Copy environment file
          cp .env.staging .env.france
          
          # Run deployment script
          chmod +x infrastructure/scripts/deploy.sh
          ./infrastructure/scripts/deploy.sh --cluster france --environment staging

      - name: Run GDPR compliance tests
        run: |
          # Wait for deployment to complete
          sleep 60
          
          # Test GDPR endpoints
          curl -f ${{ secrets.STAGING_FRANCE_API_URL }}/health
          curl -f ${{ secrets.STAGING_FRANCE_API_URL }}/privacy/policy

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'France Staging deployment: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-switzerland:
    name: Deploy to Switzerland Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.cluster == 'switzerland'
    environment:
      name: staging-switzerland
      url: https://switzerland-staging.mspr.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          # Create staging environment configuration
          cat > .env.staging << EOF
          NODE_ENV=staging
          CLUSTER_NAME=switzerland
          CLUSTER_FEATURES=
          CLUSTER_LANGUAGES=fr,de,it
          
          # Database
          POSTGRES_DB=mspr_staging_switzerland
          POSTGRES_USER=mspr_staging_switzerland_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_STAGING_SWITZERLAND }}
          
          # API
          API_TOKEN=${{ secrets.API_TOKEN_STAGING_SWITZERLAND }}
          JWT_SECRET=${{ secrets.JWT_SECRET_STAGING_SWITZERLAND }}
          
          # Services
          FRONTEND_PORT=3000
          BACKEND_PORT=3001
          NEXT_PUBLIC_API_URL=https://switzerland-staging-api.mspr.example.com
          EOF

      - name: Deploy to staging
        run: |
          # Copy environment file
          cp .env.staging .env.switzerland
          
          # Run deployment script
          chmod +x infrastructure/scripts/deploy.sh
          ./infrastructure/scripts/deploy.sh --cluster switzerland --environment staging

      - name: Run multilingual tests
        run: |
          # Wait for deployment to complete
          sleep 60
          
          # Test API endpoints
          curl -f ${{ secrets.STAGING_SWITZERLAND_API_URL }}/health
          
          # Test multilingual support
          curl -f ${{ secrets.STAGING_SWITZERLAND_FRONTEND_URL }}/?lang=fr
          curl -f ${{ secrets.STAGING_SWITZERLAND_FRONTEND_URL }}/?lang=de
          curl -f ${{ secrets.STAGING_SWITZERLAND_FRONTEND_URL }}/?lang=it

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'Switzerland Staging deployment: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Post-deployment tests
  post-deployment-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-us, deploy-france, deploy-switzerland]
    if: always() && (needs.deploy-us.result == 'success' || needs.deploy-france.result == 'success' || needs.deploy-switzerland.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install test dependencies
        run: |
          npm install -g newman
          npm install -g lighthouse

      - name: Run API tests
        run: |
          # Run Postman collection tests if available
          if [ -f "tests/postman/staging.json" ]; then
            newman run tests/postman/staging.json \
              --environment tests/postman/staging-env.json \
              --reporters cli,json \
              --reporter-json-export newman-results.json
          fi

      - name: Run lighthouse performance tests
        run: |
          # Test performance on staging environments
          if [ "${{ needs.deploy-us.result }}" == "success" ]; then
            lighthouse ${{ secrets.STAGING_US_FRONTEND_URL }} --output=json --output-path=lighthouse-us.json
          fi
          
          if [ "${{ needs.deploy-france.result }}" == "success" ]; then
            lighthouse ${{ secrets.STAGING_FRANCE_FRONTEND_URL }} --output=json --output-path=lighthouse-france.json
          fi
          
          if [ "${{ needs.deploy-switzerland.result }}" == "success" ]; then
            lighthouse ${{ secrets.STAGING_SWITZERLAND_FRONTEND_URL }} --output=json --output-path=lighthouse-switzerland.json
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-test-results
          path: |
            newman-results.json
            lighthouse-*.json

  # Security scan on staging
  security-scan:
    name: Security Scan Staging
    runs-on: ubuntu-latest
    needs: [deploy-us, deploy-france, deploy-switzerland]
    if: always() && (needs.deploy-us.result == 'success' || needs.deploy-france.result == 'success' || needs.deploy-switzerland.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: ${{ secrets.STAGING_US_FRONTEND_URL || secrets.STAGING_FRANCE_FRONTEND_URL || secrets.STAGING_SWITZERLAND_FRONTEND_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-results
          path: report_html.html

  # Notify stakeholders
  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [deploy-us, deploy-france, deploy-switzerland, post-deployment-tests, security-scan]
    if: always()
    steps:
      - name: Prepare notification
        run: |
          echo "Staging deployment completed"
          echo "US: ${{ needs.deploy-us.result }}"
          echo "France: ${{ needs.deploy-france.result }}"
          echo "Switzerland: ${{ needs.deploy-switzerland.result }}"
          echo "Post-deployment tests: ${{ needs.post-deployment-tests.result }}"
          echo "Security scan: ${{ needs.security-scan.result }}"

      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          channel: '#staging-deployments'
          custom_payload: |
            {
              text: "Staging Deployment Summary",
              attachments: [
                {
                  color: "${{ (needs.deploy-us.result == 'success' || needs.deploy-france.result == 'success' || needs.deploy-switzerland.result == 'success') && 'good' || 'danger' }}",
                  fields: [
                    { title: "US Staging", value: "${{ needs.deploy-us.result }}", short: true },
                    { title: "France Staging", value: "${{ needs.deploy-france.result }}", short: true },
                    { title: "Switzerland Staging", value: "${{ needs.deploy-switzerland.result }}", short: true },
                    { title: "Tests", value: "${{ needs.post-deployment-tests.result }}", short: true },
                    { title: "Security", value: "${{ needs.security-scan.result }}", short: true }
                  ]
                }
              ]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}