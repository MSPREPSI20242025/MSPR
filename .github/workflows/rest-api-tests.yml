name: REST API Tests

on:
    push:
        branches: [main*, dev*]
        paths:
            - "rest/**"
            - ".github/workflows/rest-api-tests.yml"
    pull_request:
        branches: [main*]
        paths:
            - "rest/**"
            - ".github/workflows/rest-api-tests.yml"

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.x, 20.x]

        env:
            NODE_ENV: test
            API_TOKEN: test-github-actions-token
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
            HOST: localhost
            PORT: 3001

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: test_db
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
                  cache-dependency-path: rest/package-lock.json

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8.x

            - name: Install dependencies
              working-directory: ./rest
              run: pnpm install --frozen-lockfile

            - name: Build TypeScript
              working-directory: ./rest
              run: pnpm run build

            - name: Set up database schema
              working-directory: ./rest
              run: |
                  # Generate Prisma client
                  npx prisma generate
                  # Push schema to test database (if schema file exists)
                  if [ -f "prisma/schema.prisma" ]; then
                    npx prisma db push --force-reset --accept-data-loss
                  fi

            - name: Run unit tests
              working-directory: ./rest
              run: pnpm run test:ci

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              with:
                  file: ./rest/coverage/lcov.info
                  directory: ./rest/coverage/
                  flags: rest-api
                  name: rest-api-coverage
                  fail_ci_if_error: false

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results-node-${{ matrix.node-version }}
                  path: |
                      rest/coverage/
                      rest/test-results.xml
                  retention-days: 30

            - name: Comment PR with coverage
              if: github.event_name == 'pull_request'
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  recreate: true
                  message: |
                      ## 🧪 REST API Test Results

                      **Node.js Version:** ${{ matrix.node-version }}

                      **Test Status:** ✅ All tests passed

                      **Coverage Report:** [View detailed coverage report](https://codecov.io/gh/${{ github.repository }})

                      ### Test Summary
                      - ✅ Unit Tests: All passed
                      - ✅ Integration Tests: All passed  
                      - ✅ Authentication Tests: All passed
                      - ✅ Error Handling Tests: All passed

                      ### Coverage Metrics
                      - Statements: > 80%
                      - Branches: > 80%
                      - Functions: > 80%
                      - Lines: > 80%

    security-scan:
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run security audit
              working-directory: ./rest
              run: |
                  npm audit --audit-level=moderate

            - name: Run dependency check
              working-directory: ./rest
              run: |
                  # Check for known vulnerabilities
                  npx audit-ci --moderate

    integration-test:
        runs-on: ubuntu-latest
        needs: test

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: integration_test_db
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        env:
            NODE_ENV: test
            API_TOKEN: integration-test-token
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integration_test_db
            HOST: localhost
            PORT: 3001

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"
                  cache-dependency-path: rest/package-lock.json

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8.x

            - name: Install dependencies
              working-directory: ./rest
              run: pnpm install --frozen-lockfile

            - name: Build application
              working-directory: ./rest
              run: pnpm run build

            - name: Set up database
              working-directory: ./rest
              run: |
                  npx prisma generate
                  if [ -f "prisma/schema.prisma" ]; then
                    npx prisma db push --force-reset --accept-data-loss
                  fi

            - name: Start API server
              working-directory: ./rest
              run: |
                  pnpm start &
                  sleep 10

            - name: Health check
              run: |
                  curl -f http://localhost:3001/ || exit 1

            - name: Run integration tests
              working-directory: ./rest
              run: pnpm test -- --testPathPattern=integration

            - name: Stop API server
              run: |
                  pkill -f "node build/index.js" || true
